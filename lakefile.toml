name = "homology-lean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["HomologyLean"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/jeffrey-dot-li/mathlib4"
rev = "simplicial-homotopy"

[[lean_lib]]
name = "HomologyLean"
